[project]
name = "bankrec"
version = "0.1.0"
description = "Transparent recommendations for publicly available U.S. bank products"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "typer>=0.12",
  "httpx>=0.27",
  "selectolax>=0.3.21",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pdfplumber>=0.11",
  "playwright>=1.47",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
]

[project.scripts]
bankrec = "bankrec.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pip-audit>=2.7",
  "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live_network'"
markers = [
  "db: requires PostgreSQL (DATABASE_URL)",
  "browser: requires Playwright Chromium",
  "pending_fixture: real-bank adapter test waiting for a verbatim official fixture",
  "live_network: contacts real external sites; never run in CI (excluded by default)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: the formatter owns line length; long literals (regexes, URLs, messages) stay readable on one line.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "S608", "E501", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "RUF012"]
"src/bankrec/ingest/pipeline.py" = ["S607"]

[tool.mypy]
python_version = "3.12"
packages = ["bankrec"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["bankrec"]
branch = true
