# Local development stack. `docker compose up` then (optionally) `docker compose run --rm worker-once`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bankrec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankrec}
      POSTGRES_DB: bankrec
      API_DB_PASSWORD: ${API_DB_PASSWORD:-bankrec_api}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankrec"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["bankrec", "db", "upgrade"]
    environment:
      DATABASE_URL: postgresql+psycopg://bankrec:${POSTGRES_PASSWORD:-bankrec}@db:5432/bankrec
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      BANKREC_ENV: ${BANKREC_ENV:-dev}
      E2E_TEST_DATA: ${E2E_TEST_DATA:-0}
      DATABASE_URL: postgresql+psycopg://bankrec:${POSTGRES_PASSWORD:-bankrec}@db:5432/bankrec
      API_DATABASE_URL: postgresql+psycopg://bankrec_api:${API_DB_PASSWORD:-bankrec_api}@db:5432/bankrec
      WEB_ORIGIN: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_TEST_DATA_BANNER: ${NEXT_PUBLIC_TEST_DATA_BANNER:-}
    environment:
      API_INTERNAL_URL: http://api:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-only-secret-change-me-0000000000}
    ports: ["3000:3000"]
    depends_on: [api]

  worker-once:
    # One-off ingestion run (the scheduled worker is in docker-compose.prod.yml).
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    entrypoint: ["bankrec", "ingest"]
    command: ${INGEST_ARGS:---include-test --bank example_bank}
    environment:
      BANKREC_ENV: ${BANKREC_ENV:-dev}
      DATABASE_URL: postgresql+psycopg://bankrec:${POSTGRES_PASSWORD:-bankrec}@db:5432/bankrec
      BANKREC_CONTACT_EMAIL: ${BANKREC_CONTACT_EMAIL:-contact@example.invalid}
      REVALIDATE_URL: http://web:3000/api/internal/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-only-secret-change-me-0000000000}
    volumes: ["./data:/app/data", "./reports:/app/reports", "./tests/fixtures:/app/tests/fixtures:ro"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    profiles: ["tools"]

volumes:
  pgdata:
