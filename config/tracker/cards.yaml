# Pages that cannot be read automatically; their offers are entered by hand (bankrec offers add) and reviewed.
manual_only:
  - {bank_id: wells_fargo, url: "https://www.wellsfargo.com/biz/business-credit/credit-cards/", why: "robots.txt disallows /biz/business-credit/credit-cards/"}
  - {bank_id: american_express, url: "https://www.americanexpress.com/us/credit-cards/card-application/apply/", why: "offer terms under /apply/ are robots-disallowed; once-per-lifetime wording cannot be captured automatically"}
  - {bank_id: chase, url: "https://sites.chase.com/", why: "Pricing & Terms pages: robots.txt disallows all crawlers"}
  - {bank_id: capital_one, url: "https://card-apis.capitalone.com/", why: "card data API answers robots.txt with 403; pages are read as static HTML only"}
  - {bank_id: capital_one, url: "https://www.capitalone.com/credit-cards/venture-x/", why: "the static page states no new-cardmember offer (only a referral bonus); the offer is filled in by scripts from card-apis.capitalone.com, which robots.txt blocks — enter it by hand from an official source"}
  - {bank_id: american_express, url: "https://www.americanexpress.com/us/credit-cards/card/gold-card/", why: "the offer is stated as 'AS HIGH AS' an amount that varies by applicant; entered by hand as an up-to offer (owner 2026-11-10: Amex offers by manual entry)"}
  - {bank_id: discover, url: "https://www.discover.com/credit-cards/student-credit-card/it-card/", why: "the first-year Cashback Match states no amount; it is not recorded as a fixed-amount campaign"}
  - {bank_id: citi, url: "https://www.citi.com/credit-cards/citi-custom-cash-credit-card", why: "no longer accepting applications as of May 28, 2026 (page text); not tracked"}
