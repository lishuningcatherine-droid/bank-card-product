# The cards the offer tracker follows (DESIGN §27.1): 25 cards (5 of them starter cards), 7 issuers, personal and business. Long-term facts
# (fees, earn rates, benefits) come from the published product (prod.products) the card links to; this file adds only
# what the pipeline does not read: the card's series, its points program, and business-card reporting facts with a
# source. Unknown facts stay null ("unknown"), never guessed.
#
# reports_to_personal_credit / counts_toward_chase_524: {value: true|false|null, source_type: official|community,
#   source_url, excerpt, verified_at}. null value = not established.
cards:
  - {card_key: chase:sapphire-preferred, bank_id: chase, canonical_key: "chase:credit_card:consumer:chase sapphire preferred:-",
     source_ids: [chase:chase-sapphire-preferred], series: Sapphire, points_program: chase_ur}
  - {card_key: chase:sapphire-reserve, bank_id: chase, canonical_key: "chase:credit_card:consumer:chase sapphire reserve:-",
     source_ids: [chase:chase-sapphire-reserve], series: Sapphire, points_program: chase_ur}
  - {card_key: chase:freedom-unlimited, bank_id: chase, canonical_key: "chase:credit_card:consumer:chase freedom unlimited:-",
     source_ids: [chase:chase-freedom-unlimited], series: Freedom, points_program: chase_ur}
  - card_key: chase:ink-business-preferred
    bank_id: chase
    canonical_key: "chase:credit_card:business:ink business preferred:-"
    source_ids: [chase:ink-business-preferred]
    series: Ink
    points_program: chase_ur
    counts_toward_chase_524: &chase_biz_524
      value: false
      source_type: community
      source_url: https://www.doctorofcredit.com/chase-524-rule-explained-detail-need-know/
      excerpt: "Keep in mind that even though Chase business cards do not normally report, they will still be counted as Chase has this information internally. Update: It seems like Chase business cards aren’t counted."
      verified_at: 2026-11-09
    reports_to_personal_credit: &chase_biz_report
      value: false
      source_type: community
      source_url: https://www.doctorofcredit.com/chase-524-rule-explained-detail-need-know/
      excerpt: "Keep in mind that even though Chase business cards do not normally report, they will still be counted as Chase has this information internally."
      verified_at: 2026-11-09
  - card_key: chase:ink-business-cash
    bank_id: chase
    canonical_key: "chase:credit_card:business:ink business cash:-"
    source_ids: [chase:ink-business-cash]
    series: Ink
    points_program: chase_ur
    counts_toward_chase_524: *chase_biz_524
    reports_to_personal_credit: *chase_biz_report
  - {card_key: amex:gold, bank_id: american_express, canonical_key: "american_express:credit_card:consumer:american express gold:-",
     source_ids: [american_express:gold-card], series: Gold, points_program: amex_mr}
