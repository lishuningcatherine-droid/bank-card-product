  # ------------------------------------------------------------------ Bank of America
  - rule_key: boa_2_3_4
    bank_id: bank_of_america
    name: "Bank of America 2/3/4: at most 2 new BofA cards per 2 months, 3 per 12 months, 4 per 24 months"
    rule_type: application_frequency
    source_type: community
    verification: community_report
    effect: approval
    strength: firm
    test: velocity
    windows: [[2, 2], [12, 3], [24, 4]]
    counts: accounts_opened
    match: {issuer: bank_of_america, segment: personal, include_authorized_users: false}
    applies_to: {bank_id: bank_of_america, segment: consumer}
    source_url: https://www.doctorofcredit.com/new-bank-of-america-234-rule-for-credit-card-approvals/
    source_title: "Doctor of Credit — New Bank of America ‘2/3/4 Rule’ for Credit Card Approvals [Confirmed] (2017)"
    excerpt: "There is a new rule from Bank of America whereby they’ll only approve you for at most two cards per rolling 2 months, three cards per rolling 12 months, and four cards per rolling 24 months."
    notes:
      - "Scope: “BofA merely limits us as to how many new BofA cards we can get per 2/12/24 month timeframe.”"
      - "Business cards: “We haven’t yet gotten confirmation whether business cards count in these numbers. The data points we’ve seen indicate that business cards do not count.”"
      - "The source is from 2017; Bank of America does not publish this rule."
    verified_at: 2026-11-10
