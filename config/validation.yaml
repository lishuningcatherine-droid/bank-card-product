# Validation policy (DESIGN §9, brief §7). Confidence is internal only and never shown to users.
confidence_threshold: 0.85
# Required for a record to be `valid` (publishable). Missing → needs_review.
required:
  credit_card: [official_name, segment, annual_fee_cents]
  checking: [official_name, monthly_fee_cents, min_opening_deposit_cents]
  savings: [official_name, monthly_fee_cents, apy]          # apy = apy_pct or apy_tiers
# Key fields for the "Verified" label. Missing → published as "Partially verified" (listed to users).
key:
  # spot-check round 1; secured deposits (round 2, F) are not applicable to unsecured cards
  credit_card: [reward_currency, base_rate, earn_rates_complete, offer_capture, secured_min_deposit_cents,
                secured_max_deposit_cents]
  checking: [fee_waivers]
  savings: [min_opening_deposit_cents]
# Shown and used when verified, but their absence does not downgrade the label (owner decision 2026-10-13, same
# rule as the purchase APR): the UI shows "See issuer", and a recommendation request that depends on the field
# excludes the card (avoid_foreign_fee → a verified 0% foreign transaction fee is required).
conditional:
  credit_card: [foreign_tx_fee_pct]
# Capture quality gate (DESIGN §24.18). Compared with the capture the published values came from: every listed section
# that capture showed must still be present, and the text must keep at least min_text_ratio of its length. score =
# (share of those sections present) × min(1, ratio / min_text_ratio); below min_score the capture is CAPTURE_DEGRADED,
# nothing is extracted from it, prod keeps its values and the source is retried next run.
capture_quality:
  sections: [product_heading, earn, fee, apr, apy]
  min_text_ratio: 0.6
  min_score: 1.0
generic_names: [unknown, "credit card", "credit cards", card, "apply now", checking, savings, "checking account",
                "savings account", "learn more", "compare cards", "rewards card", "n/a", "none"]
sanity:
  card_annual_fee_max_cents: 100000      # $1,000
  deposit_monthly_fee_max_cents: 5000    # $50
  apy_max_pct: 15
  apr_max_pct: 40
  regulator_tolerance_pct: 0.01
  regulator_tolerance_cents: 0
regulator_conflict_downgrades: false
