# Column mapping for the CFPB Terms of Credit Card Plans (TCCP) release file.
# UNCONFIRMED: consumerfinance.gov was refused by the build environment's egress policy, so these names could not be
# checked against a real release's data dictionary. The loader refuses any file that lacks these columns
# (SCHEMA_DRIFT), so a wrong mapping fails loudly instead of producing values. Update after downloading a release.
confirmed_against_release: null
columns:
  issuer_name: "Institution Name"
  plan_name: "Product Name"
  purchase_apr_min_pct: "Purchase APR Min"
  purchase_apr_max_pct: "Purchase APR Max"
  annual_fee_cents: "Annual Fee"
  foreign_tx_fee_pct: "Foreign Transaction Fee"
  bt_fee_pct: "Balance Transfer Fee Percent"
  cash_fee_pct: "Cash Advance Fee Percent"
money_columns: [annual_fee_cents]
