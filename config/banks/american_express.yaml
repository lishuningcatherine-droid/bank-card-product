# American Express. Product-type availability stays "unknown" until the reachability survey (docs/REACHABILITY.md)
# confirms it from an official page. Nothing below was retrieved from this build environment.
bank_id: american_express
display_name: "American Express"
official_domains: [americanexpress.com]
adapter: american_express
capture_timezone: America/New_York
product_types:
  credit_card: {availability: unknown, note: "pending reachability survey"}
  checking: {availability: unknown, note: "pending reachability survey"}
  savings: {availability: unknown, note: "pending reachability survey"}
meaningful_query_params: []
referral_url_patterns: []
boilerplate_phrases: []
cfpb_issuer_names: []
discovery:
  robots_url: "https://www.americanexpress.com/robots.txt"
  sitemaps: ["https://www.americanexpress.com/index-sitemap.xml"]
known_limitations:
  - "Owner pre-survey (unverified here): earn rates, caps, credits and annual fee are static (annual fee often only in the FAQ)."
  - "Owner pre-survey: welcome offers are absent from static HTML; card listing page is a JS shell; savings APY slot is blank."
  - "Owner pre-survey: robots disallows /*/apply/. Rates & Fees pages under disallowed paths are never fetched."
