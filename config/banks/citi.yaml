# Citi. robots.txt (www.citi.com and aemapi.citi.com) checked 2026-11-09: /credit-cards/ allowed; /citi/, /login and
# "*additional-information" disallowed.
bank_id: citi
display_name: "Citi"
official_domains: [citi.com]
adapter: citi
capture_timezone: America/New_York
product_types:
  credit_card:
    availability: offered
    evidence_url: "https://www.citi.com/credit-cards/view-all-credit-cards"
    note: "card pages from www.citi.com/credit-cards/cards-sitemap.xml"
  checking: {availability: unknown, note: "not surveyed"}
  savings: {availability: unknown, note: "not surveyed"}
meaningful_query_params: []
referral_url_patterns: []
boilerplate_phrases: []
product_heading_selectors: []
cfpb_issuer_names: []
discovery:
  robots_url: "https://www.citi.com/robots.txt"
  sitemaps: ["https://www.citi.com/credit-cards/cards-sitemap.xml"]
known_limitations:
  - "Card pages are rendered by script: the static HTML states the offer without its numbers ('Earn bonus points
    after spending $ in the first months'). Sources are rendered (requires_render: true); card data comes from
    aemapi.citi.com, whose robots.txt allows it (checked 2026-11-09)."
  - "The 'additional information' and terms pages under '*additional-information' are robots-disallowed and are
    never fetched; offer terms are read only from the card page itself."
