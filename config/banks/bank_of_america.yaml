# Bank of America. Reachability surveyed 2026-10-13 from the owner's machine (docs/REACHABILITY.md).
bank_id: bank_of_america
display_name: "Bank of America"
official_domains: [bankofamerica.com, bac-assets.com]  # bac-assets.com: Bank of America's asset host for the rate sheets linked from /deposits/bank-account-interest-rates/
adapter: bank_of_america
capture_timezone: America/New_York
product_types:
  credit_card:
    availability: offered
    evidence_url: "https://www.bankofamerica.com/credit-cards/"
    note: "consumer card pages from www.bankofamerica.com/credit-cards/spa-assets/sitemap.xml"
  checking: {availability: unknown, note: "not surveyed yet"}
  savings: {availability: unknown, note: "not surveyed yet"}
# The terms page shows the card selected by these parameters (taken from the card page's own link).
meaningful_query_params: [campaignid, productoffercode, locale]
referral_url_patterns: []
# Visible (not hidden) in both the static shell and the rendered page; never a block signal.
boilerplate_phrases: ["We're sorry, this page is temporarily unavailable. We apologize for the inconvenience.",
                      "temporarily unavailable"]
cfpb_issuer_names: ["Bank Of America, National Association"]  # as spelled in the TCCP release 2025-12-31
discovery:
  robots_url: "https://www.bankofamerica.com/robots.txt"
  sitemaps: ["https://www.bankofamerica.com/content/sitemap_index.xml"]
known_limitations:
  - "The static HTML of card pages holds no product details (page shell, navigation, and the visible message
    'We're sorry, this page is temporarily unavailable'). The owner's pre-survey note 'card pages are static' did not
    hold on 2026-10-13: content is inserted by the page script, so every card source is rendered
    (render_ready_selector .rates-table-body)."
  - "The 'temporarily unavailable' text is visible on every rendered card page too; it is configured as boilerplate."
  - "robots.txt disallows /deposits/*.pdf$, /products/deposits/ and others (verified 2026-10-13)."
  - "Small-business cards (/smallbusiness/) and deposit accounts are not surveyed yet."
