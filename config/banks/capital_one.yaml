# Capital One. Reachability surveyed 2026-10-13 from the owner's machine (docs/REACHABILITY.md).
bank_id: capital_one
display_name: "Capital One"
official_domains: [capitalone.com]
adapter: capital_one
capture_timezone: America/New_York
product_types:
  credit_card:
    availability: offered
    evidence_url: "https://www.capitalone.com/credit-cards/"
    note: "card pages from www.capitalone.com/credit-cards/sitemap.xml and small-business/sitemap.xml"
  checking:
    availability: offered
    evidence_url: "https://www.capitalone.com/bank/"
    note: "360 Checking is linked from every page's navigation; not yet ingested (no sources)"
  savings:
    availability: offered
    evidence_url: "https://www.capitalone.com/bank/"
    note: "360 Performance Savings is linked from every page's navigation; not yet ingested (no sources)"
meaningful_query_params: []
referral_url_patterns: []
boilerplate_phrases: []
product_heading_selectors: [".eyebrow"]
cfpb_issuer_names: ["Capital One, National Association"]  # as spelled in the TCCP release 2025-12-31
discovery:
  robots_url: "https://www.capitalone.com/robots.txt"
  sitemaps: ["https://www.capitalone.com/credit-cards/sitemap.xml", "https://www.capitalone.com/small-business/sitemap.xml"]
known_limitations:
  - "Card pages are static HTML (verified 2026-10-13). Rendering is not possible within robots.txt: the page script
    loads card data from card-apis.capitalone.com, whose robots.txt answers 403 (treated as disallow-all), and the
    app then redirects to /page-not-found/. Sources are fetched with plain HTTP (requires_render: false)."
  - "Welcome offers are read from the static HTML when stated there ('Earn a one-time $200 cash bonus once you
    spend $500 ...'); some cards state none statically (e.g. Quicksilver states its bonus without a requirement)."
  - "The Quicksilver page states no annual fee or APR in its static HTML: needs review / manual capture."
  - "Not registered: retail co-brand pages (Kohl's, Bass Pro Shops, Cabela's) that state nothing statically, and
    T-Mobile / REI, whose rewards are paid in the retailer's own currency."
