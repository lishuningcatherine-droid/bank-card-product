# Copy to config/banks/<bank_id>.yaml. See docs/ADDING_A_BANK.md.
bank_id: new_bank
display_name: "New Bank"
official_domains: [newbank.com]
adapter: new_bank            # module ingest/adapters/new_bank.py
test_only: false
capture_timezone: America/New_York
product_types:
  credit_card: {availability: unknown}
  checking: {availability: unknown}
  savings: {availability: unknown}
meaningful_query_params: []  # query params that select content; everything else is stripped
referral_url_patterns: []
block_signatures: []
boilerplate_phrases: []      # hidden phrases that must not be read as block signals
cfpb_issuer_names: []
discovery:
  robots_url: "https://www.newbank.com/robots.txt"
  sitemaps: []
known_limitations: []
