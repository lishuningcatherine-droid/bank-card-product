# its dollar figure is labelled an estimate (owner decision 2026-10-20, DESIGN §26.4). Portal or transfer-partner
# multipliers are never monetized above these values. Users can adjust the value on the results page. Served on the
# methodology page.
default_cents_per_point: 1.0
