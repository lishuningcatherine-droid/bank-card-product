# Controlled vocabulary for reward categories, with synonym phrases (matched case-insensitively, longest first).
categories:
  groceries: {label: Groceries, synonyms: ["grocery stores", "groceries", "supermarkets", "u.s. supermarkets", "grocery"]}
  # Narrower than groceries / dining: never applied to the broad user categories.
  online_grocery: {label: Online grocery, synonyms: ["online grocery", "online grocery purchases"]}
  food_delivery: {label: Food delivery, synonyms: ["select food delivery", "food delivery"]}
  dining: {label: Dining, synonyms: ["dining", "restaurants", "takeout", "eligible delivery services"]}
  # "Select travel" (e.g. flights booked directly with airlines or the issuer's portal) is not travel in general.
  select_travel: {label: Select travel, synonyms: ["select travel"]}
  travel: {label: Travel, synonyms: ["travel", "travel purchases", "hotels and car rentals"]}
  # "Flights" are airline purchases, not travel in general (which would also cover hotels, cars, cruises).
  airline: {label: Airline, synonyms: ["flights booked directly with airlines", "flights booked directly",
                                       "flights booked direct", "airline purchases", "airfare", "flights"]}
  hotel: {label: Hotel, synonyms: ["hotel stays", "hotels", "prepaid hotels", "hotels booked direct"]}
  gas: {label: Gas, synonyms: ["gas stations", "gas", "fuel", "u.s. gas stations", "gas and ev charging"]}
  ev_charging: {label: EV charging, synonyms: ["ev charging", "electric vehicle charging"]}
  entertainment: {label: Entertainment, synonyms: ["entertainment", "live entertainment"]}
  streaming: {label: Streaming, synonyms: ["streaming services", "select u.s. streaming subscriptions", "streaming"]}
  transit: {label: Transit, synonyms: ["transit", "rideshare", "commuting", "parking", "tolls", "trains", "buses"]}
  online_shopping: {label: Online shopping, synonyms: ["online shopping", "online retail purchases", "online purchases"]}
  drugstores: {label: Drugstores, synonyms: ["drugstores", "drugstore purchases", "pharmacies"]}
  wholesale_clubs: {label: Wholesale clubs, synonyms: ["wholesale clubs"]}
  home_improvement: {label: Home improvement, synonyms: ["home improvement stores", "home improvement"]}
  rotating: {label: Rotating bonus categories, synonyms: ["bonus categories", "quarterly categories", "rotating categories"]}
  other: {label: Everything else, synonyms: ["all other purchases", "all purchases", "every purchase", "everything else", "other purchases", "all other eligible purchases", "on every purchase", "everyday purchases", "other eligible purchases"]}
