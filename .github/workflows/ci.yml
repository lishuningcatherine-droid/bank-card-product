name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.12": test the oldest supported and the pinned (.python-version) interpreter.
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bankrec, POSTGRES_PASSWORD: bankrec, POSTGRES_DB: bankrec_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankrec -d bankrec_test" --health-interval 5s --health-retries 20
    env:
      UV_PYTHON: ${{ matrix.python }}
      TEST_DATABASE_URL: postgresql+psycopg://bankrec:bankrec@localhost:5432/bankrec_test
      DATABASE_URL: postgresql+psycopg://bankrec:bankrec@localhost:5432/bankrec_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen
      - name: Create read-only API role
        run: PGPASSWORD=bankrec psql -h localhost -U bankrec -d bankrec_test -c "CREATE ROLE bankrec_api LOGIN PASSWORD 'bankrec_api'"
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - name: Tests (coverage gate ≥ 85% on parsers, normalize, validation, dedup, recommend, freshness)
        run: >-
          uv run pytest -q
          --cov=bankrec.parsers --cov=bankrec.normalize --cov=bankrec.validation --cov=bankrec.dedup
          --cov=bankrec.recommend --cov=bankrec.freshness --cov-report=term --cov-fail-under=85
      - name: Registry validates
        run: uv run bankrec registry validate --include-test
      - name: OpenAPI spec is up to date
        run: uv run bankrec api openapi --path /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json
      - name: Dependency audit
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm gen:api && git diff --exit-code src/lib/api/types.gen.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env: { NEXT_PUBLIC_API_BASE_URL: "http://127.0.0.1:8010", NEXT_TELEMETRY_DISABLED: "1" }
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: [python, web]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: bankrec, POSTGRES_PASSWORD: bankrec, POSTGRES_DB: bankrec }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankrec -d bankrec" --health-interval 5s --health-retries 20
    env:
      PGPASSWORD: bankrec
      E2E_DATABASE_URL: postgresql+psycopg://bankrec:bankrec@localhost:5432/bankrec_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8010 NEXT_PUBLIC_TEST_DATA_BANNER=1 pnpm build
          pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report }

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t bankrec/api:ci .
      - run: docker build -f docker/web.Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 -t bankrec/web:ci .
      - run: docker build -f docker/worker.Dockerfile -t bankrec/worker:ci .
      - name: Compose smoke test (migrations, seed, API health, web)
        run: |
          docker compose up -d --build db migrate api web
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/api/v1/ready && break; sleep 2; done
          curl -fsS http://localhost:8000/api/v1/health
          docker compose run --rm worker-once
          curl -fsS http://localhost:3000/ > /dev/null
          docker compose exec -T api id -u | grep -v '^0$'
          docker compose exec -T web id -u | grep -v '^0$'
      - if: always()
        run: docker compose logs --no-color | tail -200
