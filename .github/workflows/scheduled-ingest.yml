name: Scheduled ingestion (alternative to the worker cron)
# Active only when the repository variable BANKREC_SCHEDULER is "github". Exactly one scheduler should be active;
# a per-tier Postgres advisory lock also prevents overlapping runs. The daily run updates the offer tracker's cards
# (`bankrec offers update`: fetch under robots.txt and rate limits, then `offers sync`); a manual run can pick a tier.
on:
  schedule:
    # once a day (owner decision 2026-11-10): 06:15 UTC = 01:15 ET in winter, 02:15 ET in summer
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "empty = the offer tracker's cards; or a tier: apy | offer | terms | regulator_release"
        required: false
        default: ""
      database:
        description: "test = the Neon test branch (secret DATABASE_URL_TEST); production = secret DATABASE_URL"
        type: choice
        options: [test, production]
        default: test
permissions:
  contents: read
jobs:
  ingest:
    # the daily schedule runs only once BANKREC_SCHEDULER is "github"; a manual run is always allowed (for testing the
    # cloud database before the schedule is switched on) and targets the test branch unless "production" is chosen
    if: github.event_name == 'workflow_dispatch' || vars.BANKREC_SCHEDULER == 'github'
    runs-on: ubuntu-latest
    concurrency:
      group: ingest-${{ inputs.tier || 'tracker' }}
      cancel-in-progress: false
    env:
      BANKREC_ENV: prod
      BANKREC_SCHEDULER: github
      CAPTURE_RUNNER_LABEL: github-actions
      # test unless a manual run explicitly chose production; the schedule always means production
      DB_TARGET: ${{ (github.event_name == 'workflow_dispatch' && inputs.database != 'production') && 'test' || 'production' }}
      BANKREC_CONTACT_EMAIL: ${{ secrets.BANKREC_CONTACT_EMAIL }}
      REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
    steps:
      - name: Choose the database (fails rather than fall back to another one)
        env:
          URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
          URL_PROD: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$DB_TARGET" = test ]; then url="$URL_TEST"; else url="$URL_PROD"; fi
          if [ -z "$url" ]; then echo "::error::no database secret for the $DB_TARGET target"; exit 1; fi
          case "$url" in *-pooler.*) echo "::error::use the direct (unpooled) connection string"; exit 1 ;; esac
          echo "::add-mask::$url"
          { echo "DATABASE_URL<<EOF_DB_URL"; echo "$url"; echo "EOF_DB_URL"; } >> "$GITHUB_ENV"
          echo "database target: $DB_TARGET"
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with: { version: "0.11.32" }
      - run: uv sync --frozen --no-dev
      - run: uv run playwright install --with-deps chromium
      # which database this run writes to, without printing its address: endpoint kind, revision, row counts
      - run: uv run bankrec db check-target
      - name: Offer tracker cards
        if: ${{ !inputs.tier }}
        run: uv run bankrec offers update --trigger github
      - name: One tier
        if: ${{ inputs.tier }}
        run: uv run bankrec ingest --tier ${{ inputs.tier }} --trigger github
      # the offer tracker records every check, failed ones included (a failed fetch never ends a campaign)
      - run: uv run bankrec offers sync
        if: ${{ always() && inputs.tier }}
      - run: uv run bankrec report stale
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports-${{ inputs.tier || 'tracker' }}-${{ github.run_id }}
          path: reports/
