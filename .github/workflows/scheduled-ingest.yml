name: Scheduled ingestion (alternative to the worker cron)
# Active only when the repository variable BANKREC_SCHEDULER is "github". Exactly one scheduler should be active;
# a per-tier Postgres advisory lock also prevents overlapping runs. The daily run updates the offer tracker's cards
# (`bankrec offers update`: fetch under robots.txt and rate limits, then `offers sync`); a manual run can pick a tier.
on:
  schedule:
    # once a day (owner decision 2026-11-10): 06:15 UTC = 01:15 ET in winter, 02:15 ET in summer
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "empty = the offer tracker's cards; or a tier: apy | offer | terms | regulator_release"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  ingest:
    if: vars.BANKREC_SCHEDULER == 'github'
    runs-on: ubuntu-latest
    concurrency:
      group: ingest-${{ inputs.tier || 'tracker' }}
      cancel-in-progress: false
    env:
      BANKREC_ENV: prod
      BANKREC_SCHEDULER: github
      CAPTURE_RUNNER_LABEL: github-actions
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BANKREC_CONTACT_EMAIL: ${{ secrets.BANKREC_CONTACT_EMAIL }}
      REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.32" }
      - run: uv sync --frozen --no-dev
      - run: uv run playwright install --with-deps chromium
      - name: Offer tracker cards
        if: ${{ !inputs.tier }}
        run: uv run bankrec offers update --trigger github
      - name: One tier
        if: ${{ inputs.tier }}
        run: uv run bankrec ingest --tier ${{ inputs.tier }} --trigger github
      # the offer tracker records every check, failed ones included (a failed fetch never ends a campaign)
      - run: uv run bankrec offers sync
        if: ${{ always() && inputs.tier }}
      - run: uv run bankrec report stale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ inputs.tier || 'tracker' }}-${{ github.run_id }}
          path: reports/
